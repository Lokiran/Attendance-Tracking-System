# Azure DevOps CI: the .NET API's tests against a real PostgreSQL 16 (the production database; the PostgreSQL tests
# must not be skipped), the container image, and the frontend checks.

trigger:
  branches:
    include: [main, feature/*]

pr:
  branches:
    include: [main]

resources:
  containers:
    - container: postgres
      image: postgres:16
      env:
        POSTGRES_USER: ats
        POSTGRES_PASSWORD: ci-only-password
        POSTGRES_DB: ats_test
      ports:
        - 5432:5432

variables:
  OFFICE_TIMEZONE: Asia/Kolkata
  DOTNET_NOLOGO: "true"
  DOTNET_CLI_TELEMETRY_OPTOUT: "true"

jobs:
  - job: backend_dotnet
    displayName: .NET backend (PostgreSQL 16)
    timeoutInMinutes: 25
    pool:
      vmImage: ubuntu-24.04
    services:
      postgres: postgres
    steps:
      - checkout: self

      - task: UseDotNet@2
        displayName: .NET SDK from backend-dotnet/global.json
        inputs:
          packageType: sdk
          useGlobalJson: true
          workingDirectory: backend-dotnet

      - bash: |
          for i in $(seq 1 60); do pg_isready -h localhost -p 5432 -U ats -d ats_test && exit 0; sleep 2; done
          echo "PostgreSQL did not start" >&2; exit 1
        displayName: Wait for PostgreSQL

      - bash: dotnet build ATS.sln -c Release
        displayName: Build (warnings are errors)
        workingDirectory: backend-dotnet

      - bash: >-
          dotnet test ATS.sln -c Release --no-build
          --logger "trx;LogFileName=backend-dotnet.trx" --results-directory "$(Agent.TempDirectory)/dotnet-results"
        displayName: Tests (PostgreSQL tests must not be skipped)
        workingDirectory: backend-dotnet
        env:
          ATS_TEST_POSTGRES_URL: postgresql://ats:ci-only-password@localhost:5432/ats_test
          ATS_REQUIRE_POSTGRES: "1"

      - task: PublishTestResults@2
        displayName: Publish .NET test results
        condition: succeededOrFailed()
        inputs:
          testResultsFormat: VSTest
          testResultsFiles: "$(Agent.TempDirectory)/dotnet-results/*.trx"
          testRunTitle: .NET backend

  - job: api_image
    displayName: .NET API container image
    timeoutInMinutes: 20
    pool:
      vmImage: ubuntu-24.04
    services:
      postgres: postgres
    steps:
      - checkout: self

      - bash: for i in $(seq 1 60); do pg_isready -h localhost -p 5432 -U ats -d ats_test && exit 0; sleep 2; done; exit 1
        displayName: Wait for PostgreSQL

      - bash: |
          set -euo pipefail
          docker build -t ats-api:ci backend-dotnet
          # Settings for the container only (the same keys as backend-dotnet/.env.example); production mode, PostgreSQL 16.
          cat > "$RUNNER_TEMP_DIR/ats.env" <<'ENV'
          APP_ENV=production
          DATABASE_URL=postgresql+psycopg://ats:ci-only-password@localhost:5432/ats_test
          SECRET_KEY=ci-only-secret-key-not-used-anywhere-else-0123456789
          OFFICE_TIMEZONE=Asia/Kolkata
          CORS_ORIGINS=https://ats.example
          ENV
          docker run --rm --network host --env-file "$RUNNER_TEMP_DIR/ats.env" ats-api:ci migrate
          docker run --rm --network host --env-file "$RUNNER_TEMP_DIR/ats.env" ats-api:ci schema-check
          docker run -d --name ats-api --network host --env-file "$RUNNER_TEMP_DIR/ats.env" ats-api:ci
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:8001/api/health/db && break; sleep 2; done
          curl -fsS http://127.0.0.1:8001/api/health/db | grep -Eq '"database": ?"postgresql"'
          curl -fsS http://127.0.0.1:8001/api/auth/providers
          docker logs ats-api
          docker rm -f ats-api
        displayName: Build the image, migrate, start it and check health (ICU, tzdata, PostgreSQL)
        env:
          RUNNER_TEMP_DIR: $(Agent.TempDirectory)

  - job: frontend
    displayName: Frontend
    timeoutInMinutes: 15
    pool:
      vmImage: ubuntu-24.04
    steps:
      - checkout: self

      - task: NodeTool@0
        inputs:
          versionSpec: "24.x"

      - bash: npm ci
        displayName: Install dependencies
        workingDirectory: frontend

      - bash: npx vitest run --reporter=default --reporter=junit --outputFile.junit=$(Agent.TempDirectory)/frontend-results.xml
        displayName: Tests
        workingDirectory: frontend

      - bash: npx tsc -b --noEmit
        displayName: Type-check
        workingDirectory: frontend

      - bash: npx vite build
        displayName: Production build
        workingDirectory: frontend

      - task: PublishTestResults@2
        displayName: Publish frontend test results
        condition: succeededOrFailed()
        inputs:
          testResultsFormat: JUnit
          testResultsFiles: "$(Agent.TempDirectory)/frontend-results.xml"
          testRunTitle: Frontend
