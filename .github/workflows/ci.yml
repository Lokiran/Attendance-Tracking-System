name: CI

# Runs every test against a real PostgreSQL 16 (the production database) plus the frontend checks.
on:
  push:
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend (PostgreSQL 16)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ats
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: ats_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ats -d ats_test"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      APP_ENV: test
      SECRET_KEY: ci-only-secret-key-not-used-anywhere-else-0123456789
      OFFICE_TIMEZONE: Asia/Kolkata
      PGPASSWORD: ci-only-password
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Create a separate database for the migration checks
        run: psql -h localhost -U ats -d ats_test -c "CREATE DATABASE ats_migrations_test"

      - name: "Migrations: upgrade, drift check, downgrade, re-upgrade"
        env:
          DATABASE_URL: postgresql+psycopg://ats:ci-only-password@localhost:5432/ats_migrations_test
        run: |
          alembic upgrade head
          alembic check
          alembic downgrade base
          alembic upgrade head
          alembic current

      - name: Backend tests (PostgreSQL integration tests must not be skipped)
        env:
          TEST_DATABASE_URL: postgresql+psycopg://ats:ci-only-password@localhost:5432/ats_test
        run: python -m pytest --require-postgres -rs --junitxml=../backend-results.xml

      - name: Report test failures as annotations
        if: failure()
        working-directory: .
        run: python .github/scripts/junit_annotations.py backend-results.xml

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Tests
        run: npx vitest run --reporter=default --reporter=junit --outputFile.junit=../frontend-results.xml

      - name: Type-check
        run: npx tsc -b --noEmit

      - name: Production build
        run: npx vite build

      - name: Report test failures as annotations
        if: failure()
        working-directory: .
        run: python3 .github/scripts/junit_annotations.py frontend-results.xml
