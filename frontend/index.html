<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <title>Nexa Attendance</title>
    <script>
      // Applied before first paint. Light is the default; "dark" and "system" are explicit choices.
      (function () {
        var t = "light";
        try { var s = localStorage.getItem("ats-color-theme"); if (s === "dark" || s === "system") t = s; } catch (e) {}
        document.documentElement.dataset.theme = t;
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
